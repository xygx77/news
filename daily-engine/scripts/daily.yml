name: Daily Briefing
on:
  schedule:
    # 08:17 / 09:47 Asia/Shanghai. The first ten minutes of a UTC hour are
    # GitHub's busiest scheduler slot: on 11-07 and 11-08 the 00:10 event was
    # never delivered (no run, no failure, green badge). Two off-peak slots give
    # the daily run a second chance when one event is dropped.
    - cron: "17 0 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-briefing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      # China bond yield curve fallback (optional; the brief marks it 暂缺 when unset)
      FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: daily-engine
      - run: uv run --no-sync horizon-daily --config data/config.daily.json --out ../docs/daily
        working-directory: daily-engine
      - run: touch docs/.nojekyll
      - name: Verify today's pages exist
        run: |
          day="$(date +%F)"
          test -f "docs/daily/${day}/morning.html" && test -f "docs/daily/${day}/laser.html" \
            || { echo "::error::no pages generated for ${day}"; exit 1; }
          echo "generated docs/daily/${day}"
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No page changes"
          else
            git commit -m "daily: $(date +%F)"
            git pull --rebase --autostash
            git push origin HEAD:main
          fi
