name: Daily Briefing
on:
  schedule:
    # 00:10 UTC = 08:10 Asia/Shanghai
    - cron: "10 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-briefing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      # China bond yield curve fallback (optional; the brief marks it 暂缺 when unset)
      FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: daily-engine
      - run: uv run --no-sync horizon-daily --config data/config.daily.json --out ../docs/daily
        working-directory: daily-engine
      - run: touch docs/.nojekyll
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No page changes"
          else
            git commit -m "daily: $(date +%F)"
            git pull --rebase --autostash
            git push origin HEAD:main
          fi
